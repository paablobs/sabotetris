<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Sabotetris - The pieces fight back</title>
  <desc id="desc">A chaotic Tetris game with sabotage effects.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#191933"/>
      <stop offset="1" stop-color="#0d0d1a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4d6d" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff4d6d"/>
      <stop offset="1" stop-color="#ffb86b" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <path d="M0 530H1200" stroke="#29294a" stroke-width="2"/>
  <path d="M0 100H1200" stroke="#29294a" stroke-width="2" opacity=".5"/>

  <!-- Falling blocks -->
  <g transform="translate(120 110)" stroke="#0d0d1a" stroke-width="5">
    <rect x="70" y="0" width="80" height="80" rx="8" fill="#b86bff"/>
    <rect x="0" y="80" width="80" height="80" rx="8" fill="#b86bff"/>
    <rect x="80" y="80" width="80" height="80" rx="8" fill="#b86bff"/>
    <rect x="160" y="80" width="80" height="80" rx="8" fill="#b86bff"/>
    <rect x="0" y="270" width="80" height="80" rx="8" fill="#4dd0ff"/>
    <rect x="0" y="350" width="80" height="80" rx="8" fill="#4dd0ff"/>
    <rect x="80" y="350" width="80" height="80" rx="8" fill="#4dd0ff"/>
    <rect x="160" y="350" width="80" height="80" rx="8" fill="#4dd0ff"/>
    <rect x="240" y="350" width="80" height="80" rx="8" fill="#ff4d6d"/>
    <rect x="320" y="350" width="80" height="80" rx="8" fill="#ff4d6d"/>
  </g>
  <path d="M170 475l105-50 100 42 130-76" fill="none" stroke="url(#glow)" stroke-width="12" stroke-linecap="round"/>
  <circle cx="285" cy="425" r="8" fill="#ffe066"/>
  <circle cx="495" cy="393" r="7" fill="#ffb86b"/>

  <g font-family="monospace, 'Courier New', monospace">
    <text x="570" y="260" fill="#ddeeff" font-size="86" font-weight="700" letter-spacing="5">SABO</text>
    <text x="570" y="350" fill="#ff4d6d" font-size="86" font-weight="700" letter-spacing="5">TETRIS</text>
    <rect x="575" y="390" width="360" height="5" fill="url(#glow)"/>
    <text x="575" y="445" fill="#aab8cc" font-size="26" letter-spacing="6">THE PIECES FIGHT BACK</text>
    <text x="575" y="500" fill="#667788" font-size="22" letter-spacing="3">STACK. CLEAR. SURVIVE THE CHAOS.</text>
  </g>
</svg>
