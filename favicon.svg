<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Sabotetris">
  <rect width="64" height="64" rx="10" fill="#1a1a2e"/>
  <!-- I-piece, broken in two -->
  <g>
    <rect x="10" y="20" width="11" height="11" rx="2" fill="#ff4d6d"/>
    <rect x="21" y="20" width="11" height="11" rx="2" fill="#ff4d6d"/>
    <rect x="32" y="20" width="11" height="11" rx="2" fill="#ff4d6d"/>
    <rect x="43" y="20" width="11" height="11" rx="2" fill="#ff4d6d"/>
  </g>
  <!-- Lower half shifted right: sabotage effect -->
  <g>
    <rect x="15" y="31" width="11" height="11" rx="2" fill="#ff4d6d" opacity="0.6"/>
    <rect x="26" y="31" width="11" height="11" rx="2" fill="#ff4d6d" opacity="0.6"/>
    <rect x="37" y="31" width="11" height="11" rx="2" fill="#ff4d6d" opacity="0.6"/>
    <rect x="48" y="31" width="11" height="11" rx="2" fill="#ff4d6d" opacity="0.6"/>
  </g>
  <!-- Lightning crack between the two halves -->
  <path d="M 26 22 L 34 30 L 30 30 L 38 38"
        stroke="#ffb86b" stroke-width="2" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Spark dots -->
  <circle cx="22" cy="26" r="1.5" fill="#ffe066"/>
  <circle cx="42" cy="34" r="1.5" fill="#ffe066"/>
</svg>
