project_id = "sabotetris"

# Authentication is verified explicitly with auth.getUser(token) in both
# write handlers. Required for publishable API keys / current signing-key projects.
[functions.start-run]
verify_jwt = false

[functions.submit-score]
verify_jwt = false

# Bounded, rate-limited public read; no Auth session/CAPTCHA needed to view.
[functions.leaderboard]
verify_jwt = false
